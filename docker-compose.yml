services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudnative-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudnative
      POSTGRES_PASSWORD: Shanu@2006
      POSTGRES_DB: cloudnative_db
    ports:
      - "5432:5432"
    volumes:
      - cloudnative_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnative -d cloudnative_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cloudnative-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cloudnative_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudnative-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://cloudnative:Shanu%402006@postgres:5432/cloudnative_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "2adfaf826fe16ff10a903cc6dd1ee2c321effd1ac565ab86c4788ec6994e5525"
      JWT_EXPIRES_IN: "1d"
      CLIENT_URL: "http://localhost:5173"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudnative-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  cloudnative_pgdata:
  cloudnative_redisdata:
