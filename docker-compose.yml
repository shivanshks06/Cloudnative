services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudnative-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudnative
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cloudnative_db
    volumes:
      - cloudnative_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnative -d cloudnative_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cloudnative-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cloudnative_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ${DOCKERHUB_USERNAME}/cloudnative-backend:${IMAGE_TAG:-latest}
    container_name: cloudnative-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${DOCKERHUB_USERNAME}/cloudnative-backend:${IMAGE_TAG:-latest}
    container_name: cloudnative-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      CLIENT_URL: ${CLIENT_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ${DOCKERHUB_USERNAME}/cloudnative-frontend:${IMAGE_TAG:-latest}
    container_name: cloudnative-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  cloudnative_pgdata:
  cloudnative_redisdata:
