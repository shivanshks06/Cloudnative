services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudnative-postgres
    restart: unless-stopped
    mem_limit: 384m
    cpus: "0.50"
    environment:
      POSTGRES_USER: cloudnative
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cloudnative_db
    volumes:
      - cloudnative_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnative -d cloudnative_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cloudnative-redis
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cloudnative_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ${DOCKERHUB_USERNAME}/cloudnative-backend:${IMAGE_TAG:-latest}
    container_name: cloudnative-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${DOCKERHUB_USERNAME}/cloudnative-backend:${IMAGE_TAG:-latest}
    container_name: cloudnative-backend
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      CLIENT_URL: ${CLIENT_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ${DOCKERHUB_USERNAME}/cloudnative-frontend:${IMAGE_TAG:-latest}
    container_name: cloudnative-frontend
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    ports:
      - "80:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: cloudnative-prometheus
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.35"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cloudnative_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  grafana:
    image: grafana/grafana:latest
    container_name: cloudnative-grafana
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.35"
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - cloudnative_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    container_name: cloudnative-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cloudnative-cadvisor
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"

  loki:
    image: grafana/loki:3.6.5
    container_name: cloudnative-loki
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.35"
    command:
      - "-config.file=/etc/loki/config.yaml"
    volumes:
      - ./logging/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - cloudnative_loki_data:/loki
    expose:
      - "3100"

  alloy:
    image: grafana/alloy:v1.11.0
    container_name: cloudnative-alloy
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - cloudnative_alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

volumes:
  cloudnative_pgdata:
  cloudnative_redisdata:
  cloudnative_prometheus_data:
  cloudnative_grafana_data:
  cloudnative_loki_data:
  cloudnative_alloy_data:
