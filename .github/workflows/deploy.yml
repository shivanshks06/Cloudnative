name: CloudNative Deployment

on:
  workflow_run:
    workflows: ["CloudNative CI/CD Pipeline"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare deployment environment
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e

          test -n "$PRODUCTION_ENV"
          test -n "$EC2_HOST"
          test -n "$DOCKERHUB_USERNAME"

          rm -f .env
          umask 077
          printf '%s\n' "$PRODUCTION_ENV" > .env

          # Remove old values so the new values are unambiguous.
          sed -i '/^IMAGE_TAG=/d' .env
          sed -i '/^CLIENT_URL=/d' .env
          sed -i '/^DOCKERHUB_USERNAME=/d' .env

          # Use the exact image version built by CI.
          echo "IMAGE_TAG=sha-${CI_COMMIT:0:7}" >> .env

          # Update configuration for the newly created EC2 instance.
          echo "CLIENT_URL=http://${EC2_HOST}" >> .env
          echo "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}" >> .env

          chmod 600 .env
          test -s .env

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,.env"
          target: "/opt/cloudnative"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            cd /opt/cloudnative

            chmod 600 .env

            echo "$DOCKERHUB_TOKEN" | docker login \
              -u "$DOCKERHUB_USERNAME" --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans

            echo "Checking migration..."
            docker compose logs migrate --tail=100

            echo "Checking containers..."
            docker compose ps

            docker image prune -f
