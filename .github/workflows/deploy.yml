name: CloudNative SSM Deployment

on:
  workflow_run:
    workflows: ["CloudNative CI/CD Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Inspect OIDC Token Claims
        run: |
          ID_TOKEN=$(curl -sLS -H "User-Agent: actions/exec" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== Decoded JWT Payload ==="
          echo "$ID_TOKEN" | jq -R 'split(".") | .[1] | @base64d | fromjson'

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Sync secrets to AWS Parameter Store
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          if [ -n "$PRODUCTION_ENV" ]; then
            echo "Syncing /cloudnative/production-env to Parameter Store..."
            aws ssm put-parameter \
              --name "/cloudnative/production-env" \
              --type SecureString \
              --value "$PRODUCTION_ENV" \
              --overwrite \
              --region ap-south-1
          fi

          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "Syncing /cloudnative/dockerhub-token to Parameter Store..."
            aws ssm put-parameter \
              --name "/cloudnative/dockerhub-token" \
              --type SecureString \
              --value "$DOCKERHUB_TOKEN" \
              --overwrite \
              --region ap-south-1
          fi

      - name: Deploy through AWS SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_URL: ${{ vars.APP_URL }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          DOCKER_USER_FALLBACK: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          test -n "$INSTANCE_ID"
          test -n "$APP_URL"

          REMOTE_SCRIPT=$(cat <<REMOTE
          #!/bin/bash
          set -euo pipefail
          set +x

          REGION="ap-south-1"
          INSTANCE_DIR="/opt/cloudnative"

          mkdir -p "\$INSTANCE_DIR"
          cd "\$INSTANCE_DIR"

          # Install required utilities if missing.
          if ! command -v aws >/dev/null 2>&1; then
            apt-get update
            apt-get install -y awscli
          fi

          if ! command -v curl >/dev/null 2>&1; then
            apt-get update
            apt-get install -y curl
          fi

          # Retrieve encrypted production configuration.
          aws ssm get-parameter \
            --name "/cloudnative/production-env" \
            --with-decryption \
            --region "\$REGION" \
            --query 'Parameter.Value' \
            --output text > .env

          TOKEN=\$(aws ssm get-parameter \
            --name "/cloudnative/dockerhub-token" \
            --with-decryption \
            --region "\$REGION" \
            --query 'Parameter.Value' \
            --output text)

          chmod 600 .env

          # Set configuration for this deployment.
          sed -i '/^IMAGE_TAG=/d; /^CLIENT_URL=/d' .env
          printf '\nIMAGE_TAG=sha-${COMMIT_SHA:0:7}\nCLIENT_URL=${APP_URL}\n' >> .env

          DOCKER_USER=\$(sed -n 's/^DOCKERHUB_USERNAME=//p' .env | tail -n 1)
          if [ -z "\$DOCKER_USER" ]; then
            DOCKER_USER="${DOCKER_USER_FALLBACK:-}"
            if [ -n "\$DOCKER_USER" ]; then
              echo "DOCKERHUB_USERNAME=\$DOCKER_USER" >> .env
            fi
          fi

          if [ -z "\$DOCKER_USER" ]; then
            echo "DOCKERHUB_USERNAME is missing from production configuration."
            exit 1
          fi

          # Download Compose file from the exact CI commit.
          curl -fsSL \
            "https://raw.githubusercontent.com/shivanshks06/Cloudnative/${COMMIT_SHA}/docker-compose.yml" \
            -o docker-compose.yml

          # Authenticate and deploy.
          echo "\$TOKEN" | docker login \
            --username "\$DOCKER_USER" \
            --password-stdin

          unset TOKEN

          docker compose pull
          docker compose up -d --remove-orphans

          # Verify migration and containers.
          docker compose ps -a
          docker compose logs migrate --tail=100

          # Verify application responds locally.
          for attempt in \$(seq 1 24); do
            if curl -fsS http://localhost/ >/dev/null; then
              echo "CloudNative deployment successful."
              exit 0
            fi
            sleep 5
          done

          echo "Application health check failed."
          docker compose logs --tail=100
          exit 1
          REMOTE
          )

          PARAMETERS=$(jq -n --arg command "$REMOTE_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "CloudNative deployment ${COMMIT_SHA}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out."
          exit 1
